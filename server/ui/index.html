<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Neuralwatt AI · 控制台</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/vendor/vue.runtime.global.prod.js" defer></script>
    <script src="/vendor/admin-render.js" defer></script>
    <script src="/vendor/lucide.min.js" defer></script>
    <script src="/app.js" defer></script>
  </head>
  <body>
    <div id="app-mount"></div>
    <template id="app-template">
    <div id="app" v-cloak>
      <section v-if="!sessionReady" class="auth-screen">
        <div class="boot-state"><span class="brand-mark"><i data-lucide="orbit"></i></span><i data-lucide="loader-circle"></i><span>正在连接管理服务</span></div>
      </section>
      <section v-else-if="!authenticated" class="auth-screen">
        <div class="auth-panel">
          <div class="brand-lockup">
            <span class="brand-mark"><i data-lucide="orbit"></i></span>
            <span>NEURALWATT <b>V2</b></span>
          </div>
          <p class="overline">ADMIN CONTROL PLANE</p>
          <h1>{{ hasPassword ? "管理员登录" : "初始化管理员" }}</h1>
          <p class="auth-copy">{{ hasPassword ? "使用管理员密码建立安全会话。" : "首次启动需要设置管理员密码。" }}</p>
          <form class="auth-form" @submit.prevent="hasPassword ? login() : setup()">
            <label v-if="!hasPassword" class="field">
              <span>Bootstrap token</span>
              <input v-model.trim="authForm.bootstrapToken" type="password" autocomplete="off" required placeholder="粘贴启动日志中的 token" />
            </label>
            <label class="field">
              <span>{{ hasPassword ? "管理员密码" : "新密码" }}</span>
              <input v-model="authForm.password" type="password" :autocomplete="hasPassword ? 'current-password' : 'new-password'" required minlength="8" placeholder="至少 8 位" />
            </label>
            <label v-if="!hasPassword" class="field">
              <span>确认密码</span>
              <input v-model="authForm.confirm" type="password" autocomplete="new-password" required minlength="8" placeholder="再次输入密码" />
            </label>
            <p v-if="authError" class="inline-error" role="alert">{{ authError }}</p>
            <button class="button primary full" type="submit" :disabled="authPending">
              <i :data-lucide="authPending ? 'loader-circle' : 'log-in'"></i>
              {{ authPending ? "处理中" : (hasPassword ? "登录" : "创建管理员") }}
            </button>
          </form>
          <p v-if="!hasPassword && !bootstrapConfigured" class="auth-note">Bootstrap token 由本次启动生成，请检查服务启动日志。</p>
        </div>
      </section>

      <div v-else class="console-shell">
        <aside class="sidebar" :class="{ open: sidebarOpen }">
          <div class="sidebar-brand">
            <span class="brand-mark"><i data-lucide="orbit"></i></span>
            <span class="brand-name">NEURALWATT <small>V2</small></span>
          </div>
          <nav class="nav-list" aria-label="管理模块">
            <button v-for="item in navItems" :key="item.id" class="nav-item" :class="{ active: activeTab === item.id }" type="button" @click="selectTab(item.id)">
              <i :data-lucide="item.icon"></i><span>{{ item.label }}</span>
              <em v-if="item.id === 'accounts' && accounts.length" class="nav-count">{{ accounts.length }}</em>
            </button>
          </nav>
          <div class="sidebar-foot">
            <span class="health-dot" :class="health.className"></span>
            <span>{{ health.text }}</span>
            <button class="icon-button" type="button" title="刷新服务状态" aria-label="刷新服务状态" @click="checkHealth"><i data-lucide="refresh-cw"></i></button>
          </div>
        </aside>

        <div class="main-column">
          <header class="topbar">
            <button class="icon-button menu-button" type="button" title="打开导航" aria-label="打开导航" @click="sidebarOpen = !sidebarOpen"><i data-lucide="menu"></i></button>
            <div class="topbar-title">
              <span class="section-kicker">{{ currentNav.label }}</span>
              <h1>{{ currentNav.title }}</h1>
            </div>
            <div class="topbar-actions">
              <span class="session-label"><i data-lucide="shield-check"></i> 会话有效至 {{ formatTime(expiresAt) }}</span>
              <button class="button subtle" type="button" @click="refreshAll"><i data-lucide="refresh-cw"></i> 刷新</button>
              <button class="button subtle" type="button" @click="logout"><i data-lucide="log-out"></i> 退出</button>
            </div>
          </header>

          <main class="content" @click="sidebarOpen = false">
            <div v-if="globalError" class="alert error" role="alert"><i data-lucide="triangle-alert"></i><span>{{ globalError }}</span><button class="icon-button" type="button" title="关闭提示" aria-label="关闭提示" @click="globalError = ''"><i data-lucide="x"></i></button></div>

            <section v-if="activeTab === 'overview'" class="view-stack">
              <div class="metric-grid">
                <article class="metric"><span class="metric-label">启用账号</span><strong>{{ enabledAccounts.length }}</strong><small>共 {{ accounts.length }} 个账号</small><i data-lucide="users"></i></article>
                <article class="metric"><span class="metric-label">可用会话</span><strong>{{ readyAccounts.length }}</strong><small>{{ expiredAccounts.length }} 个需要处理</small><i data-lucide="circle-check"></i></article>
                <article class="metric"><span class="metric-label">API keys</span><strong>{{ enabledKeys.length }}</strong><small>共 {{ keys.length }} 个密钥</small><i data-lucide="key-round"></i></article>
                <article class="metric"><span class="metric-label">模型目录</span><strong>{{ models.length }}</strong><small>{{ catalog.scope || "未同步" }}</small><i data-lucide="boxes"></i></article>
              </div>
              <div class="split-grid">
                <section class="panel">
                  <div class="panel-head"><div><p class="overline">ACCOUNT HEALTH</p><h2>账号状态</h2></div><button class="button subtle" type="button" @click="selectTab('accounts')">管理账号 <i data-lucide="arrow-up-right"></i></button></div>
                  <div v-if="!accounts.length" class="empty"><i data-lucide="inbox"></i><p>还没有配置上游账号</p><button class="button primary" type="button" @click="selectTab('accounts')">添加账号</button></div>
                  <div v-else class="health-list">
                    <div v-for="account in accounts.slice(0, 6)" :key="account.id" class="health-row"><span class="status-dot" :class="statusClass(account.status)"></span><span class="health-main"><b>{{ account.label }}</b><small>{{ account.email }}</small></span><span class="status-text" :class="statusClass(account.status)">{{ statusLabel(account.status) }}</span><span class="health-time">{{ formatTime(account.lastCheckedAt) }}</span></div>
                  </div>
                </section>
                <section class="panel">
                  <div class="panel-head"><div><p class="overline">RUNTIME DEFAULTS</p><h2>生成参数</h2></div><button class="button subtle" type="button" @click="selectTab('settings')">调整 <i data-lucide="sliders-horizontal"></i></button></div>
                  <div class="default-summary"><div><span>Temperature</span><b>{{ Number(defaults.temperature).toFixed(1) }}</b></div><div><span>Max tokens</span><b>{{ defaults.maxTokens }}</b></div><div><span>Top P</span><b>{{ Number(defaults.topP).toFixed(1) }}</b></div></div>
                  <p class="panel-note">客户端显式参数优先于全局默认值。</p>
                </section>
              </div>
            </section>

            <section v-if="activeTab === 'accounts'" class="view-stack">
              <section class="panel">
                <div class="panel-head"><div><p class="overline">UPSTREAM ACCOUNTS</p><h2>{{ accountForm.editingId ? "编辑账号" : "添加账号" }}</h2></div><span class="panel-meta">写入 Cookie 会清除旧会话状态</span></div>
                <form class="form-grid" @submit.prevent="saveAccount">
                  <label class="field"><span>显示名称</span><input v-model.trim="accountForm.label" required maxlength="80" placeholder="例如：主账号" /></label>
                  <label class="field"><span>邮箱</span><input v-model.trim="accountForm.email" required type="email" autocomplete="username" placeholder="name@example.com" /></label>
                  <label class="field"><span>密码</span><input v-model="accountForm.password" type="password" autocomplete="new-password" :placeholder="accountForm.editingId ? '留空表示不修改' : '账号密码'" /></label>
                  <label class="field wide"><span>Cookie（可选）</span><textarea v-model.trim="accountForm.cookie" rows="2" autocomplete="off" placeholder="Cookie 请求头；不会回显"></textarea></label>
                  <label v-if="accountForm.editingId" class="check-field wide"><input v-model="accountForm.clearCookie" type="checkbox" /> 清除已保存 Cookie</label>
                  <label class="check-field"><input v-model="accountForm.enabled" type="checkbox" /> 启用账号</label>
                  <div class="form-actions wide"><button class="button primary" type="submit" :disabled="accountForm.pending"><i :data-lucide="accountForm.pending ? 'loader-circle' : 'save'"></i>{{ accountForm.pending ? "保存中" : (accountForm.editingId ? "保存修改" : "添加账号") }}</button><button v-if="accountForm.editingId" class="button subtle" type="button" @click="resetAccountForm">取消</button></div>
                </form>
              </section>
              <section class="panel">
                <div class="panel-head"><div><p class="overline">ACCOUNT INVENTORY</p><h2>账号列表</h2></div><span class="panel-meta">{{ accounts.length }} 个记录</span></div>
                <div v-if="resourceErrors.accounts" class="resource-error">{{ resourceErrors.accounts }}</div>
                <div v-if="loading.accounts" class="loading-row"><i data-lucide="loader-circle"></i> 正在加载账号…</div>
                <div v-else-if="!accounts.length" class="empty"><i data-lucide="inbox"></i><p>暂无账号</p></div>
                <div v-else class="table-scroll"><table><thead><tr><th>账号</th><th>状态</th><th>会话</th><th>最近检查</th><th class="align-right">操作</th></tr></thead><tbody><tr v-for="account in accounts" :key="account.id"><td><b>{{ account.label }}</b><small>{{ account.email }}</small></td><td><span class="status-pill" :class="statusClass(account.status)" :title="account.lastError || ''"><span class="status-dot"></span>{{ statusLabel(account.status) }}</span></td><td><span :class="account.hasCookie ? 'text-good' : 'text-muted'">{{ account.hasCookie ? "已保存" : "未设置" }}</span></td><td>{{ formatTime(account.lastCheckedAt) }}</td><td class="row-actions"><button class="icon-button" type="button" title="编辑账号" aria-label="编辑账号" @click="editAccount(account)"><i data-lucide="pencil"></i></button><button class="icon-button" type="button" title="登录账号" aria-label="登录账号" :disabled="busyId === account.id" @click="accountAction('login', account)"><i data-lucide="log-in"></i></button><button class="icon-button" type="button" title="检查会话" aria-label="检查会话" :disabled="busyId === account.id" @click="accountAction('check', account)"><i data-lucide="scan-search"></i></button><button class="icon-button" type="button" :title="account.enabled ? '停用账号' : '启用账号'" :aria-label="account.enabled ? '停用账号' : '启用账号'" :disabled="busyId === account.id" @click="accountAction('toggle', account)"><i :data-lucide="account.enabled ? 'pause' : 'play'"></i></button><button class="icon-button danger" type="button" title="删除账号" aria-label="删除账号" :disabled="busyId === account.id" @click="accountAction('delete', account)"><i data-lucide="trash-2"></i></button></td></tr></tbody></table></div>
              </section>
            </section>

            <section v-if="activeTab === 'keys'" class="view-stack">
              <section class="panel accent-panel">
                <div class="panel-head"><div><p class="overline">INFERENCE ACCESS</p><h2>创建 API key</h2></div><span class="panel-meta">密钥只在创建完成时显示一次</span></div>
                <form class="inline-form" @submit.prevent="createKey"><label class="field grow"><span>名称</span><input v-model.trim="keyLabel" maxlength="80" required placeholder="例如：生产客户端" /></label><button class="button primary" type="submit" :disabled="keyPending"><i :data-lucide="keyPending ? 'loader-circle' : 'key-round'"></i>{{ keyPending ? "生成中" : "生成密钥" }}</button></form>
              </section>
              <section class="panel"><div class="panel-head"><div><p class="overline">KEY INVENTORY</p><h2>API keys</h2></div><span class="panel-meta">不保存明文密钥</span></div><div v-if="resourceErrors.keys" class="resource-error">{{ resourceErrors.keys }}</div><div v-if="loading.keys" class="loading-row"><i data-lucide="loader-circle"></i> 正在加载密钥…</div><div v-else-if="!keys.length" class="empty"><i data-lucide="key-round"></i><p>暂无 API key</p></div><div v-else class="table-scroll"><table><thead><tr><th>名称</th><th>预览</th><th>状态</th><th>更新时间</th><th class="align-right">操作</th></tr></thead><tbody><tr v-for="key in keys" :key="key.id"><td><b>{{ key.label }}</b><small>{{ key.id }}</small></td><td><code>{{ key.preview }}</code></td><td><span class="status-pill" :class="key.enabled ? 'ready' : 'muted'"><span class="status-dot"></span>{{ key.enabled ? "启用" : "停用" }}</span></td><td>{{ formatTime(key.updatedAt) }}</td><td class="row-actions"><button class="icon-button" type="button" title="重命名" aria-label="重命名" @click="renameKey(key)"><i data-lucide="pencil"></i></button><button class="icon-button" type="button" :title="key.enabled ? '停用密钥' : '启用密钥'" :aria-label="key.enabled ? '停用密钥' : '启用密钥'" @click="toggleKey(key)"><i :data-lucide="key.enabled ? 'pause' : 'play'"></i></button><button class="icon-button danger" type="button" title="删除密钥" aria-label="删除密钥" @click="deleteKey(key)"><i data-lucide="trash-2"></i></button></td></tr></tbody></table></div></section>
            </section>

            <section v-if="activeTab === 'models'" class="view-stack">
              <section class="panel"><div class="panel-head"><div><p class="overline">MODEL CATALOG</p><h2>模型目录</h2><p class="panel-note">{{ catalog.fetchedAt ? `范围：${catalog.scope || "未知"} · 更新于 ${formatTime(catalog.fetchedAt)}` : "尚未同步模型目录" }}</p></div><button class="button primary" type="button" :disabled="modelPending" @click="refreshModels"><i :data-lucide="modelPending ? 'loader-circle' : 'cloud-download'"></i>{{ modelPending ? "同步中" : "同步目录" }}</button></div><div v-if="resourceErrors.models" class="resource-error">{{ resourceErrors.models }}</div><div v-if="loading.models" class="loading-row"><i data-lucide="loader-circle"></i> 正在加载目录…</div><div v-else-if="!models.length" class="empty"><i data-lucide="boxes"></i><p>暂无模型数据</p></div><div v-else class="model-grid"><button v-for="model in models" :key="model.id" class="model-item" type="button" :class="{ selected: tester.model === model.id }" @click="tester.model = model.id; selectTab('tester')"><span>{{ modelName(model) }}</span><code>{{ model.id }}</code><i data-lucide="chevron-right"></i></button></div></section>
            </section>

            <section v-if="activeTab === 'settings'" class="view-stack">
              <section class="panel"><div class="panel-head"><div><p class="overline">GENERATION DEFAULTS</p><h2>全局生成参数</h2></div><span class="panel-meta">请求显式值优先</span></div><form class="settings-grid" @submit.prevent="saveDefaults"><label class="range-control"><span>Temperature <output>{{ Number(defaults.temperature).toFixed(1) }}</output></span><input v-model.number="defaults.temperature" type="range" min="0" max="2" step="0.1" /><small>0.0 - 2.0</small></label><label class="range-control"><span>Max tokens <output>{{ defaults.maxTokens }}</output></span><input v-model.number="defaults.maxTokens" type="number" min="1" max="1000000" step="1" /><small>1 - 1,000,000</small></label><label class="range-control"><span>Top P <output>{{ Number(defaults.topP).toFixed(1) }}</output></span><input v-model.number="defaults.topP" type="range" min="0" max="1" step="0.1" /><small>0.0 - 1.0</small></label><div class="form-actions wide"><button class="button primary" type="submit" :disabled="defaultsPending"><i :data-lucide="defaultsPending ? 'loader-circle' : 'save'"></i>{{ defaultsPending ? "保存中" : "保存参数" }}</button></div></form></section>
            </section>

            <section v-if="activeTab === 'tester'" class="view-stack">
              <section class="panel tester-panel"><div class="panel-head"><div><p class="overline">REQUEST PROBE</p><h2>接口测试台</h2><p class="panel-note">请求在服务端执行，不需要复制 API key。</p></div><span class="status-pill" :class="tester.pending ? 'warning' : 'muted'"><span class="status-dot"></span>{{ tester.pending ? "请求中" : "待命" }}</span></div><form class="test-grid" @submit.prevent="runTest"><label class="field"><span>模型</span><select v-model="tester.model" required><option value="" disabled>选择模型</option><option v-for="model in models" :key="model.id" :value="model.id">{{ model.id }}</option></select></label><label class="check-field test-stream"><input v-model="tester.stream" type="checkbox" /> 流式响应</label><label class="field wide"><span>消息</span><textarea v-model.trim="tester.message" rows="4" required placeholder="请只回复 TEST_OK"></textarea></label><div class="form-actions wide"><button class="button primary" type="submit" :disabled="tester.pending"><i :data-lucide="tester.pending ? 'loader-circle' : 'send'"></i>{{ tester.pending ? "请求中" : "发送请求" }}</button><button class="button subtle" type="button" @click="tester.output = ''; tester.meta = ''">清空输出</button></div></form><div class="test-meta" v-if="tester.meta">{{ tester.meta }}</div><pre class="output-box" :class="{ empty: !tester.output }">{{ tester.output || "响应输出会显示在这里" }}</pre></section>
            </section>

            <section v-if="activeTab === 'security'" class="view-stack">
              <section class="panel"><div class="panel-head"><div><p class="overline">SESSION SECURITY</p><h2>管理员密码</h2><p class="panel-note">修改密码后，其他管理员会话将被撤销。</p></div><i class="panel-icon" data-lucide="shield"></i></div><form class="security-form" @submit.prevent="changePassword"><label class="field"><span>当前密码</span><input v-model="passwordForm.current" type="password" autocomplete="current-password" required /></label><label class="field"><span>新密码</span><input v-model="passwordForm.next" type="password" autocomplete="new-password" minlength="8" required /></label><label class="field"><span>确认新密码</span><input v-model="passwordForm.confirm" type="password" autocomplete="new-password" minlength="8" required /></label><div class="form-actions wide"><button class="button primary" type="submit" :disabled="passwordPending"><i :data-lucide="passwordPending ? 'loader-circle' : 'lock-keyhole'"></i>{{ passwordPending ? "更新中" : "更新密码" }}</button></div></form></section>
            </section>
          </main>
        </div>
      </div>

      <div v-if="keySecret" class="modal-backdrop" role="presentation" @click.self="keySecret = null"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="secret-title"><div class="modal-icon"><i data-lucide="key-round"></i></div><h2 id="secret-title">密钥已创建</h2><p>这是唯一一次显示完整密钥。关闭后只能撤销并重新创建。</p><div class="secret-box"><code>{{ keySecret.secret }}</code><button class="icon-button" type="button" title="复制密钥" aria-label="复制密钥" @click="copySecret"><i data-lucide="copy"></i></button></div><div class="modal-actions"><button class="button primary" type="button" @click="keySecret = null">我已保存</button></div></section></div>
      <div v-if="notice.text" class="toast" :class="notice.kind" role="status"><i :data-lucide="notice.kind === 'error' ? 'triangle-alert' : 'circle-check'"></i>{{ notice.text }}</div>
    </div>
    </template>
  </body>
</html>
