services:
  nlt2api:
    image: ${NEURALWATT_IMAGE:-ghcr.io/jianjianai/nlt2api:latest}
    container_name: nlt2api
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NEURALWATT_HOST_PORT:-3000}:3000"
    environment:
      NEURALWATT_ADMIN_TOKEN: ${NEURALWATT_ADMIN_TOKEN:?set NEURALWATT_ADMIN_TOKEN}
      NEURALWATT_API_KEY: ${NEURALWATT_API_KEY:-}
      NEURALWATT_ALLOW_ANONYMOUS: ${NEURALWATT_ALLOW_ANONYMOUS:-false}
      NEURALWATT_DEFAULT_MODEL: ${NEURALWATT_DEFAULT_MODEL:-kimi-k3-fast}
    volumes:
      # A named volume preserves the non-root ownership from the image.
      - neuralwatt-data:/app/.data

volumes:
  neuralwatt-data:
