services:
  deepinfra-gateway:
    image: ${DEEPINFRA_GATEWAY_IMAGE:-ghcr.io/jianjianai/nlt2api:latest}
    container_name: deepinfra-gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DEEPINFRA_GATEWAY_HOST_PORT:-3000}:3000"
    environment:
      DEEPINFRA_GATEWAY_ADMIN_TOKEN: ${DEEPINFRA_GATEWAY_ADMIN_TOKEN:?set DEEPINFRA_GATEWAY_ADMIN_TOKEN}
      DEEPINFRA_GATEWAY_API_KEY: ${DEEPINFRA_GATEWAY_API_KEY:-}
      DEEPINFRA_GATEWAY_ALLOW_ANONYMOUS: ${DEEPINFRA_GATEWAY_ALLOW_ANONYMOUS:-false}
      DEEPINFRA_GATEWAY_DEFAULT_MODEL: ${DEEPINFRA_GATEWAY_DEFAULT_MODEL:-moonshotai/Kimi-K3}
      DEEPINFRA_GATEWAY_DATA_DIR: /app/.data
      DEEPINFRA_BROWSER_PATH: /usr/bin/chromium
      DEEPINFRA_DISPLAY: :99
      DEEPINFRA_PROFILE_DIR: /app/.data/deepinfra-profile
      DEEPINFRA_TURNSTILE_MINTERS: ${DEEPINFRA_TURNSTILE_MINTERS:-2}
      DEEPINFRA_TURNSTILE_BASE_PORT: ${DEEPINFRA_TURNSTILE_BASE_PORT:-9333}
    volumes:
      - ./data:/app/.data
