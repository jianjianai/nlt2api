name: Publish Docker images

# 推送 v* 标签触发：构建并发布 gateway / minter 两个镜像到 GHCR。
# gateway 与 minter 两条链路（验证 + 构建）完全并行，pnpm 与 Docker 均走缓存。
on:
  push:
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io
  # github.repository 是 <owner>/<repo>，镜像命名为 <repo>-gateway / <repo>-minter
  GATEWAY_IMAGE: ghcr.io/${{ github.repository }}-gateway
  MINTER_IMAGE: ghcr.io/${{ github.repository }}-minter

jobs:
  # 公共步骤：校验标签格式。
  validate-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag format
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if ! [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag must look like vX.Y.Z, got '$GITHUB_REF_NAME'"
            exit 1
          fi
          echo "release version: $TAG"

  # gateway 链路：验证（pnpm 依赖缓存）→ 构建发布（buildx 缓存）。
  verify-gateway:
    needs: validate-tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Set up Node (cached)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: gateway/pnpm-lock.yaml

      - name: Verify gateway
        working-directory: gateway
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
          pnpm build

  docker-gateway:
    needs: verify-gateway
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GATEWAY_IMAGE }}

      - name: Build and push (cached)
        uses: docker/build-push-action@v6
        with:
          context: ./gateway
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,mode=max,scope=gateway

  # minter 链路：验证（pnpm 依赖缓存）→ 构建发布（buildx 缓存）。
  verify-minter:
    needs: validate-tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Set up Node (cached)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: minter/pnpm-lock.yaml

      - name: Verify minter
        working-directory: minter
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test

  docker-minter:
    needs: verify-minter
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.MINTER_IMAGE }}

      - name: Build and push (cached)
        uses: docker/build-push-action@v6
        with:
          context: ./minter
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=minter
          cache-to: type=gha,mode=max,scope=minter